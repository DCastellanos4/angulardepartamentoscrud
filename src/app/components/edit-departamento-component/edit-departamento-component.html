<section class="form-card">
  <h1>Editar departamento</h1>
  <form #selectDepart="ngForm">
    <label>Numero</label>
    <input type="number" #numero name="numero" disabled placeholder="{{ departamento.numero }}" />
    <label>Nombre</label>
    <input type="text" #nombre name="nombre" placeholder="{{ departamento.nombre }}" />
    <label>Localidad</label>
    <input type="text" #localidad name="localidad" placeholder="{{ departamento.localidad }}" />
    <button (click)="editarDepartamento()">Editar</button>
  </form>
</section>
