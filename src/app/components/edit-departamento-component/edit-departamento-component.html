@if (departamento) {
  <section class="form-card">
    <header class="form-header">
      <div class="header-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </div>
      <div class="header-text">
        <h1>Editar Departamento</h1>
        <p class="subtitle">Modifica los datos del registro #{{ departamento.numero }}</p>
      </div>
    </header>

    <form #selectDepart="ngForm">
      <!-- Número (Solo Lectura) -->
      <div class="form-group">
        <label for="numero">
          <span>Número</span>
          <span class="badge-readonly">Solo lectura</span>
        </label>
        <div class="input-wrapper disabled">
          <input
            id="numero"
            type="number"
            #numero
            name="numero"
            disabled
            [value]="departamento.numero"
          />
          <svg
            class="input-icon-trailing"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
      </div>

      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <div class="input-wrapper">
          <input
            id="nombre"
            type="text"
            #nombre
            name="nombre"
            [value]="departamento.nombre"
            placeholder="Ej. CONTABILIDAD"
          />
        </div>
      </div>

      <!-- Localidad -->
      <div class="form-group">
        <label for="localidad">Localidad</label>
        <div class="input-wrapper">
          <input
            id="localidad"
            type="text"
            #localidad
            name="localidad"
            [value]="departamento.localidad"
            placeholder="Ej. MADRID"
          />
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions">
        <a class="btn-cancel" [routerLink]="['/depart']">Cancelar</a>
        <button type="button" class="btn-submit" (click)="editarDepartamento()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="btn-icon"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span>Guardar Cambios</span>
        </button>
      </div>
    </form>
  </section>
} @else {
  <section class="form-card loading-card">
    <div class="spinner"></div>
    <p>Cargando datos del departamento...</p>
  </section>
}
