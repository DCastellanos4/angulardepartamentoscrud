<section class="form-card">
  <h1>Crear departamento</h1>
  <form create="ngForm">
    <label for="numero">Número</label>
    <input id="numero" type="number" name="numero" #numero />
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" #nombre name="nombre" />
    <label for="localidad">Localidad</label>
    <input id="localidad" type="text" #localidad name="localidad" />
    <button type="button" (click)="createDepart()">Crear</button>
  </form>
</section>
