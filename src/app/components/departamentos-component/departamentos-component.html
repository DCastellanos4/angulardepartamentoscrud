<section class="table-card">
  <h1>Departamentos</h1>
  <table class="department-table">
    <thead>
      <tr>
        <th>Número</th>
        <th>Nombre</th>
        <th>Localidad</th>
        <th>Detalles</th>
        <th>Editar</th>
      </tr>
    </thead>
    <tbody>
      @for (departamento of departamentos; track departamento.numero) {
        <tr>
          <td>{{ departamento.numero }}</td>
          <td>{{ departamento.nombre }}</td>
          <td>{{ departamento.localidad }}</td>
          <td class="action-cell">
            <a
              class="btn-details"
              [routerLink]="[
                '/details/',
                departamento.numero,
                departamento.nombre,
                departamento.localidad
              ]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="btn-icon"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Detalles</span>
            </a>
          </td>
          <td class="action-cell">
            <a
              class="btn-edit btn-details"
              [routerLink]="[
                '/edit/',
                departamento.numero
              ]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="btn-icon"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Editar</span>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
