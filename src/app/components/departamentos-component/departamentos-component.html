<section class="table-card">
  <h1>Departamentos</h1>
  <table class="department-table">
    <thead>
      <tr>
        <th>Número</th>
        <th>Nombre</th>
        <th>Localidad</th>
        <th>Detalles</th>
        <th>Editar</th>
        <th>Eliminar</th>
      </tr>
    </thead>
    <tbody>
      @for (departamento of departamentos; track departamento.numero) {
        <tr>
          <td>{{ departamento.numero }}</td>
          <td>{{ departamento.nombre }}</td>
          <td>{{ departamento.localidad }}</td>
          <td class="action-cell">
            <a
              class="btn-action btn-details"
              [routerLink]="[
                '/details/',
                departamento.numero,
                departamento.nombre,
                departamento.localidad
              ]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="btn-icon"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Detalles</span>
            </a>
          </td>
          <td class="action-cell">
            <a
              class="btn-action btn-edit"
              [routerLink]="[
                '/edit/',
                departamento.numero
              ]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="btn-icon btn-icon-edit"
              >
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
              </svg>
              <span>Editar</span>
            </a>
          </td>
          <td class="action-cell">
            <button
              type="button"
              class="btn-action btn-delete"
              (click)="deleteDepart(departamento.numero)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="btn-icon btn-icon-delete"
              >
                <path d="M3 6h18" />
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                <line x1="10" x2="10" y1="11" y2="17" />
                <line x1="14" x2="14" y1="11" y2="17" />
              </svg>
              <span>Eliminar</span>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
